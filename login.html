<!DOCTYPE html>
<html>

<head>

    <title>Teacher Login</title>

    <style>

        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        .login-box {
            width: 350px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 10px #aaa;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 30px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h2>Teacher Login</h2>

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</body>

</html>
