<!DOCTYPE html>
<html>

<head>

    <title>Edit Student</title>

</head>

<body>

    <h1>Edit Student</h1>

    <form method="POST">

        <input
            type="text"
            name="student_id"
            value="{{ student.student_id }}"
            placeholder="Student ID"
            required
        >

        <br><br>

        <input
            type="text"
            name="name"
            value="{{ student.name }}"
            placeholder="Student Name"
            required
        >

        <br><br>

        <input
            type="text"
            name="department"
            value="{{ student.department }}"
            placeholder="Department"
            required
        >

        <br><br>

        <input
            type="text"
            name="semester"
            value="{{ student.semester }}"
            placeholder="Semester"
            required
        >

        <br><br>

        <input
            type="text"
            name="section"
            value="{{ student.section }}"
            placeholder="Section"
        >

        <br><br>

        <button type="submit">
            Update Student
        </button>

    </form>

</body>

</html>
